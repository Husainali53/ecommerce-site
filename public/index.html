<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">ShopHub</div>
            <nav>
                <a href="#home" onclick="showHome()">Home</a>
                <a href="#shop" onclick="showShop()">Shop</a>
                <a href="#cart" onclick="showCart()">Cart <span id="cart-count">0</span></a>
                <a href="#account" onclick="showAccount()">Account</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Home Section -->
        <section id="home" class="section active">
            <div class="hero">
                <h1>Welcome to ShopHub</h1>
                <p>Discover amazing products at unbeatable prices</p>
                <button onclick="showShop()" class="btn btn-primary">Start Shopping</button>
            </div>
        </section>

        <!-- Shop Section -->
        <section id="shop" class="section">
            <div class="container">
                <h2>Our Products</h2>
                <div class="search-filter">
                    <input type="text" id="search-input" placeholder="Search products..." onkeyup="searchProducts()">
                    <select id="category-filter" onchange="filterByCategory()">
                        <option value="">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home">Home</option>
                    </select>
                </div>
                <div id="products-grid" class="products-grid"></div>
            </div>
        </section>

        <!-- Cart Section -->
        <section id="cart" class="section">
            <div class="container">
                <h2>Shopping Cart</h2>
                <div id="cart-items" class="cart-items"></div>
                <div class="cart-summary">
                    <h3>Total: $<span id="cart-total">0.00</span></h3>
                    <button class="btn btn-primary" onclick="checkout()">Proceed to Checkout</button>
                    <button class="btn btn-secondary" onclick="clearCart()">Clear Cart</button>
                </div>
            </div>
        </section>

        <!-- Account Section -->
        <section id="account" class="section">
            <div class="container">
                <div id="login-form" class="auth-form">
                    <h2>Login / Register</h2>
                    <input type="text" id="name" placeholder="Full Name" style="display:none;">
                    <input type="email" id="email" placeholder="Email">
                    <input type="password" id="password" placeholder="Password">
                    <button class="btn btn-primary" onclick="login()">Login</button>
                    <button class="btn btn-secondary" onclick="toggleRegister()">Create Account</button>
                </div>
                <div id="user-profile" class="user-profile" style="display:none;">
                    <h2 id="user-name"></h2>
                    <p id="user-email"></p>
                    <h3>Order History</h3>
                    <div id="order-history"></div>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ShopHub. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
